name: Keep Services Alive

on:
  schedule:
    # Every 5 minutes — prevents Vercel free-tier cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          echo "[$(date -u)] Pinging Vercel API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -X OPTIONS \
            "${{ vars.VERCEL_API_URL }}/api/seed" \
            -H "Origin: ${{ vars.GITHUB_PAGES_URL }}" \
            -H "Access-Control-Request-Method: POST" \
            || echo "000")
          echo "Vercel API status: $STATUS"

      - name: Ping GitHub Pages
        run: |
          echo "[$(date -u)] Pinging GitHub Pages..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ vars.GITHUB_PAGES_URL }}" \
            || echo "000")
          echo "GitHub Pages status: $STATUS"

      - name: Summary
        run: echo "✅ Keep-alive ping completed at $(date -u)"
