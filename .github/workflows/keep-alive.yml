name: Keep Services Alive

on:
  schedule:
    # Every 5 minutes — prevents Netlify/Vercel free-tier cold starts
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          echo "[$(date -u)] Pinging Vercel API..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -X OPTIONS \
            "${{ vars.VERCEL_API_URL }}/api/seed" \
            -H "Origin: https://example.com" \
            -H "Access-Control-Request-Method: POST" \
            || echo "000")
          echo "Vercel API status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Vercel API unreachable"
          fi

      - name: Ping Netlify Site
        run: |
          echo "[$(date -u)] Pinging Netlify site..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "${{ vars.NETLIFY_SITE_URL }}" \
            || echo "000")
          echo "Netlify site status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "⚠️ Netlify site unreachable"
          fi

      - name: Health check summary
        run: |
          echo "✅ Keep-alive ping completed at $(date -u)"
          echo "Vercel:  ${{ vars.VERCEL_API_URL }}"
          echo "Netlify: ${{ vars.NETLIFY_SITE_URL }}"
