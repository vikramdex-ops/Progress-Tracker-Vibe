name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc -b --noEmit

      - name: Build
        run: bun run build

      - name: Package build output
        run: |
          cd dist
          zip -r ../progress-tracker-${{ github.sha }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Progress Tracker — Build #${{ github.run_number }}"
          body: |
            ## Progress Tracker — Production Build
            
            **Commit:** ${{ github.sha }}
            **Workflow Run:** #${{ github.run_number }}
            
            ### Setup
            1. Extract the zip
            2. Host the `dist/` folder on any static host (Vercel, Netlify, Nginx)
            3. The API runs on Vercel — deploy the `api/` directory alongside
            
            ### Environment Variables
            - `AIRTABLE_PAT` — Your Airtable Personal Access Token
            - `AIRTABLE_BASE_ID` — Your Airtable Base ID
            
            ### Quick Start
            ```bash
            # For local development
            bun install
            bun run dev
            
            # For production
            bun run build
            # Serve dist/ folder
            ```
          files: progress-tracker-${{ github.sha }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
