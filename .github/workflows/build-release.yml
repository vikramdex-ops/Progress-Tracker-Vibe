name: Build, Release & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Only allow one deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun tsc -b --noEmit

      - name: Validate environment
        run: |
          API_URL="${{ vars.API_BASE_URL }}"
          if [ -z "$API_URL" ]; then
            API_URL="https://progress-tracker-vibe-vikrams-projects-221b97a9.vercel.app/api"
            echo "⚠️ vars.API_BASE_URL empty, using fallback: $API_URL"
          fi
          # Workaround for primary alias video/mp2t cache issue — prefer working alias
          if [[ "$API_URL" == "https://progress-tracker-vibe.vercel.app/api" ]]; then
            echo "⚠️ Primary alias has edge cache issue (video/mp2t), switching to working alias"
            API_URL="https://progress-tracker-vibe-vikrams-projects-221b97a9.vercel.app/api"
          fi
          echo "✅ API URL configured: $API_URL"
          echo "VITE_API_URL=$API_URL" >> $GITHUB_ENV
        env:
          VITE_API_URL: ${{ vars.API_BASE_URL }}

      - name: Build
        run: bun run build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

      - name: Add SPA fallback & nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          echo "SPA fallback ready: $(ls -lh dist/index.html dist/404.html)"

      - name: Upload artifact for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: dist

      - name: Package build output
        run: |
          cd dist
          zip -r ../progress-tracker-${{ github.run_number }}.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Progress Tracker — Build #${{ github.run_number }}"
          body: |
            ## Progress Tracker — Production Build

            **Commit:** ${{ github.sha }}
            **Workflow Run:** #${{ github.run_number }}
            **Live Site:** ${{ github.server_url }}/${{ github.repository }}

            ### What's Included
            - Complete frontend (React + Vite)
            - Gamification (XP, badges, streaks, levels)
            - Team lead dashboard with entry management
            - Employee dashboard with EOD submission
            - Light/dark mode, responsive design

            ### Deployment
            - **Frontend:** GitHub Pages (auto-deployed)
            - **API:** Deploy `api/` folder to Vercel
            - **Backend:** Airtable (free tier)

            ### Environment Variables (Vercel)
            ```
            AIRTABLE_PAT=your_pat_here
            AIRTABLE_BASE_ID=appXXXXXXXXXX
            ```
          files: progress-tracker-${{ github.run_number }}.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
