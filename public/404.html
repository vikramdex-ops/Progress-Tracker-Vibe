<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA redirect — handles both root and sub-route 404s
    (function(l) {
      // Extract path after repo prefix
      var base = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var pathname = l.pathname;
      
      // Remove trailing slash, then find the repo name segment
      // For /Progress-Tracker-Vibe/ or /Progress-Tracker-Vibe/employee
      var segments = pathname.split('/').filter(Boolean);
      var repoName = segments[0] || '';
      
      // Build the target path: /repo-name/?/remaining-path
      var remaining = segments.slice(1).join('/');
      var query = remaining ? '?/' + remaining : '';
      
      // Redirect to index.html with hash-based routing
      l.replace(base + '/' + repoName + '/index.html' + query + l.search + l.hash);
    }(window.location));
  </script>
</head>
<body>
  <p>If you are not redirected automatically, <a href="/Progress-Tracker-Vibe/">go back</a>.</p>
</body>
</html>
